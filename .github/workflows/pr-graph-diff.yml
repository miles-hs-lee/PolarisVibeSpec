name: PR graph diff

on:
  pull_request:
    paths:
      - '.polaris/graph.json'
      - '.polaris/codemap.json'
      - 'spec/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history so `git show <base>:.polaris/graph.json` works

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run pv diff against base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e
          OUTPUT=$(node dist/cli.js diff "$BASE_SHA" --pretty 2>&1)
          EXIT=$?
          set -e
          # exit 2 = breaking change detected; we still want to comment
          if [[ $EXIT -ne 0 && $EXIT -ne 2 ]]; then
            echo "::error::pv diff failed unexpectedly"
            echo "$OUTPUT"
            exit $EXIT
          fi
          {
            echo 'output<<EOF'
            echo "$OUTPUT"
            echo 'EOF'
            echo "exit=$EXIT"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const raw = `${{ steps.diff.outputs.output }}`;
            const exit = `${{ steps.diff.outputs.exit }}`;
            let report;
            try {
              report = JSON.parse(raw);
            } catch (e) {
              report = { ok: false, summary: { nodes_added: 0, nodes_removed: 0, nodes_changed: 0, relations_added: 0, relations_removed: 0, has_breaking: false }, parse_error: raw };
            }
            const s = report.summary || {};
            const flag = s.has_breaking ? '⚠️ **Breaking changes detected**' : '✅ No breaking changes';
            const body = `### 📐 Graph diff vs base
            ${flag}

            | metric | count |
            |---|---|
            | nodes added | ${s.nodes_added ?? '?'} |
            | nodes removed | ${s.nodes_removed ?? '?'} |
            | nodes changed | ${s.nodes_changed ?? '?'} |
            | relations added | ${s.relations_added ?? '?'} |
            | relations removed | ${s.relations_removed ?? '?'} |

            <details><summary>Full output</summary>

            \`\`\`json
            ${raw}
            \`\`\`
            </details>

            _Generated by \`pv diff\` — see [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md#before-you-open-a-pr)._`;

            // Find existing comment to update, otherwise create.
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body && c.body.startsWith('### 📐 Graph diff'));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
