name: PV intent-drift gate

# Phase 3a of the post-pivot rollout: a free, deterministic
# structural-drift gate on every PR. Runs `pv changed` against the
# PR base, posts a Markdown summary as a PR comment (updating the
# previous run's comment in place), and fails the check on
# warn/error severity findings so the gate is enforceable.
#
# Cost: zero LLM calls. ~1-3 seconds of Node execution per PR.
# Phase 3b (`pv review --prompt` automation) is intentionally not
# wired here — it requires LLM API access and per-PR cost; teams
# can add it later by extending this workflow with a manual job.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # for posting/updating PR comments

jobs:
  pv-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git diff base..HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Skip if no .polaris/ in this repo
        id: check
        run: |
          if [ ! -d .polaris ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "no .polaris/ — pv not adopted in this repo, skipping"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pv changed
        if: steps.check.outputs.skip != 'true'
        id: pv
        # Capture the exit code (0 clean / 1 drift) so we can post the
        # comment regardless and re-emit at the end.
        run: |
          set +e
          node dist/cli.js changed "origin/${{ github.base_ref }}" --pretty > /tmp/pv-changed.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          # Always show the JSON in the action log for easy debugging.
          cat /tmp/pv-changed.json

      - name: Format PR comment
        if: steps.check.outputs.skip != 'true'
        run: python3 scripts/pv-changed-comment.py /tmp/pv-changed.json > /tmp/pv-comment.md

      - name: Post or update PR comment
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pv-comment.md', 'utf8');
            const marker = '<!-- pv-changed-bot -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // Find an existing comment from this bot (so successive
            // pushes update one comment instead of accumulating).
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }

      - name: Re-emit pv changed exit code (gate the check)
        if: steps.check.outputs.skip != 'true' && steps.pv.outputs.exit_code != '0'
        run: |
          echo "::error::pv changed reported drift (exit ${{ steps.pv.outputs.exit_code }}); see PR comment for details"
          exit 1
