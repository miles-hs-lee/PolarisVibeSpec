name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Validate graph integrity
        run: node dist/cli.js validate

      - name: Graph health
        run: node dist/cli.js health --pretty

      - name: PRD-Intent drift check
        run: |
          if [ -d docs/prd ] || [ -f .polaris/prd-sources.json ]; then
            node dist/cli.js prd check --pretty
          else
            echo "No PRD sources configured — skipping."
          fi

      - name: Spec drift check
        run: |
          node dist/cli.js export-all
          if ! git diff --quiet spec/; then
            echo "::error::spec/ is out of sync with .polaris/graph.json."
            echo "Run 'npm run spec' locally and commit the result."
            git --no-pager diff --stat spec/
            exit 1
          fi

      - name: Diagrams drift check
        run: |
          python3 scripts/regen-diagrams.py
          if ! git diff --quiet docs/ARCHITECTURE.md docs/ARCHITECTURE.ko.md; then
            echo "::error::ARCHITECTURE diagrams out of sync with .polaris/graph.json."
            echo "Run 'npm run diagrams' locally and commit the result."
            git --no-pager diff --stat docs/ARCHITECTURE.md docs/ARCHITECTURE.ko.md
            exit 1
          fi
